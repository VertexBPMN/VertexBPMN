name: VertexBPMN CI

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: src/VertexBPMN.Studio/package-lock.json
    - name: Reject tracked build artifacts
      shell: bash
      run: bash scripts/verify-no-tracked-build-artifacts.sh
    - name: Install Studio asset dependencies
      working-directory: src/VertexBPMN.Studio
      run: npm ci
    - name: Build and verify pinned bpmn.io assets
      shell: bash
      working-directory: src/VertexBPMN.Studio
      run: |
        npm run build:bpmnio
        npm run test:vertex-moddle
        git diff --exit-code -- wwwroot/lib
    - name: Restore dependencies
      run: dotnet restore VertexBPMN.sln
    - name: Build
      run: dotnet build VertexBPMN.sln --configuration Release --no-restore
    - name: Test green suite
      run: dotnet test VertexBPMN.sln --configuration Release --no-build --no-restore --verbosity normal --filter-not-trait "Category=Phase1Acceptance" --filter-not-trait "Category=Phase3ExternalAcceptance" --max-parallel-test-modules 1
    - name: Verify persistent BPMN runtime contracts
      shell: bash
      run: bash scripts/verify-phase1-acceptance-baseline.sh
    - name: Verify OpenAPI snapshot
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/verify-openapi-snapshot.sh
    - name: Setup kubectl for manifest validation
      if: runner.os == 'Linux'
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.33.4'
    - name: Validate Kubernetes manifests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        kubectl apply --dry-run=client --validate=false -f k8s-prerequisites.yaml
        kubectl apply --dry-run=client --validate=false -f k8s-migration-job.yaml
        kubectl apply --dry-run=client --validate=false -f k8s-deployment.yaml
    - name: Pack SDK
      if: runner.os == 'Linux'
      run: dotnet pack src/VertexBPMN.Sdk/VertexBPMN.Sdk.csproj --configuration Release --no-build --output artifacts/nuget
    - name: Upload SDK package artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: vertexbpmn-sdk-nuget
        path: artifacts/nuget/*
        if-no-files-found: error
        retention-days: 14
    - name: Publish Docker image
      if: runner.os == 'Linux'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: vertexbpmn:ci

  operational-integration:
    name: Operational integration (RabbitMQ and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1.3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: vertexbpmn-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERTEXBPMN_TEST_RABBITMQ: amqp://guest:guest@localhost:5672/
      VERTEXBPMN_TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=vertexbpmn-ci
    steps:
    - uses: actions/checkout@v4
    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore operational tests
      run: dotnet restore tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj
    - name: Build operational tests
      run: dotnet build tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj --configuration Release --no-restore
    - name: Verify real broker roundtrip and database migrations
      run: dotnet test tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj --configuration Release --no-build --no-restore --filter-trait "Category=Phase3ExternalAcceptance" --max-parallel-test-modules 1 --output Normal

  publish-sdk:
    name: Publish VertexBPMN.Sdk and CLI to NuGet
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore SDK
      run: dotnet restore src/VertexBPMN.Sdk/VertexBPMN.Sdk.csproj
    - name: Pack release version
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
          echo "Tag '$GITHUB_REF_NAME' is not a valid NuGet version."
          exit 1
        fi
        dotnet pack src/VertexBPMN.Sdk/VertexBPMN.Sdk.csproj --configuration Release --no-restore --output artifacts/nuget -p:PackageVersion="$version"
        ls -la artifacts/nuget
    - name: Restore CLI
      run: dotnet restore src/VertexBPMN.Cli/VertexBPMN.Cli.csproj
    - name: Pack CLI tool
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        dotnet pack src/VertexBPMN.Cli/VertexBPMN.Cli.csproj --configuration Release --no-restore --output artifacts/nuget -p:PackageVersion="$version"
        ls -la artifacts/nuget
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish packages to NuGet.org
      run: |
        for package in artifacts/nuget/*.nupkg; do
          dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
