name: VertexBPMN CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high

  dependency-audit:
    name: NuGet and npm audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: src/VertexBPMN.Studio/package-lock.json
    - run: dotnet restore VertexBPMN.sln
    - working-directory: src/VertexBPMN.Studio
      run: npm ci
    - name: Audit resolved dependencies
      shell: bash
      run: bash scripts/verify-dependency-audit.sh

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
    - uses: actions/checkout@v7
    - uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
    - if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - if: matrix.language == 'csharp'
      run: dotnet restore VertexBPMN.sln
    - if: matrix.language == 'csharp'
      run: dotnet build VertexBPMN.sln --configuration Release --no-restore -p:SkipBpmnIoAssetBuild=true
    - uses: github/codeql-action/analyze@v4

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: src/VertexBPMN.Studio/package-lock.json
    - name: Reject tracked build artifacts
      shell: bash
      run: bash scripts/verify-no-tracked-build-artifacts.sh
    - working-directory: src/VertexBPMN.Studio
      run: npm ci
    - name: Build and verify pinned bpmn.io assets
      shell: bash
      working-directory: src/VertexBPMN.Studio
      run: |
        npm run build:bpmnio
        npm run test:vertex-moddle
        git diff --exit-code -- wwwroot/lib
    - run: dotnet restore VertexBPMN.sln
    - run: dotnet build VertexBPMN.sln --configuration Release --no-restore
    - name: Test green suite
      run: dotnet test VertexBPMN.sln --configuration Release --no-build --no-restore --verbosity normal --filter-not-trait "Category=Phase1Acceptance" --filter-not-trait "Category=Phase3ExternalAcceptance" --max-parallel-test-modules 1
    - name: Verify persistent BPMN runtime contracts
      shell: bash
      run: bash scripts/verify-phase1-acceptance-baseline.sh
    - name: Verify advanced feature qualification contracts
      shell: bash
      run: bash scripts/verify-phase4-acceptance.sh
    - name: Verify OpenAPI snapshot
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/verify-openapi-snapshot.sh
    - if: runner.os == 'Linux'
      uses: azure/setup-kubectl@v5
      with:
        version: 'v1.33.4'
    - name: Validate Kubernetes manifests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        kubectl apply --dry-run=client --validate=false -f k8s-prerequisites.yaml
        kubectl apply --dry-run=client --validate=false -f k8s-migration-job.yaml
        kubectl apply --dry-run=client --validate=false -f k8s-deployment.yaml
    - name: Pack SDK and CLI
      if: runner.os == 'Linux'
      run: |
        dotnet pack src/VertexBPMN.Sdk/VertexBPMN.Sdk.csproj --configuration Release --no-build --output artifacts/nuget
        dotnet pack src/VertexBPMN.Cli/VertexBPMN.Cli.csproj --configuration Release --no-build --output artifacts/nuget
    - if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: vertexbpmn-nuget
        path: artifacts/nuget/*
        if-no-files-found: error
        retention-days: 14
    - name: Build API container
      if: runner.os == 'Linux'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: vertexbpmn:ci
    - name: Build Studio container
      if: runner.os == 'Linux'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: src/VertexBPMN.Studio/Dockerfile
        push: false
        tags: vertexbpmn-studio:ci

  supply-chain:
    name: Coverage, secret, SBOM and container gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: src/VertexBPMN.Studio/package-lock.json
    - working-directory: src/VertexBPMN.Studio
      run: npm ci
    - name: Restore and build test target
      run: |
        dotnet restore tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj
        dotnet build tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj --configuration Release --no-restore -p:SkipBpmnIoAssetBuild=true
    - name: Enforce coverage thresholds
      shell: bash
      run: bash scripts/verify-coverage.sh
    - name: Scan dependencies, secrets and configuration
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - name: Build release container
      run: docker build --tag vertexbpmn:${{ github.sha }} .
    - name: Build Studio release container
      run: docker build --file src/VertexBPMN.Studio/Dockerfile --tag vertexbpmn-studio:${{ github.sha }} .
    - name: Scan API release container
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: vertexbpmn:${{ github.sha }}
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan Studio release container
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: vertexbpmn-studio:${{ github.sha }}
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - name: Generate API SPDX SBOM
      uses: anchore/sbom-action@v0.24.0
      with:
        image: vertexbpmn:${{ github.sha }}
        format: spdx-json
        output-file: artifacts/sbom/vertexbpmn.spdx.json
        artifact-name: vertexbpmn-sbom.spdx.json
    - name: Generate Studio SPDX SBOM
      uses: anchore/sbom-action@v0.24.0
      with:
        image: vertexbpmn-studio:${{ github.sha }}
        format: spdx-json
        output-file: artifacts/sbom/vertexbpmn-studio.spdx.json
        artifact-name: vertexbpmn-studio-sbom.spdx.json

  operational-integration:
    name: Operational integration (RabbitMQ and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1.3-alpine
        ports: [ '5672:5672' ]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: vertexbpmn-ci
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERTEXBPMN_TEST_RABBITMQ: amqp://guest:guest@localhost:5672/
      VERTEXBPMN_TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=vertexbpmn-ci
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - run: dotnet restore tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj
    - run: dotnet build tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj --configuration Release --no-restore -p:SkipBpmnIoAssetBuild=true
    - name: Verify real broker roundtrip and database migrations
      run: dotnet test tests/VertexBPMN.Tests/VertexBPMN.Tests.csproj --configuration Release --no-build --no-restore --filter-trait "Category=Phase3ExternalAcceptance" --max-parallel-test-modules 1 --output Normal

  release-gate:
    name: Clean release qualification
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, dependency-audit, codeql, supply-chain, operational-integration]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: src/VertexBPMN.Studio/package-lock.json
    - name: Build and verify Studio assets
      working-directory: src/VertexBPMN.Studio
      shell: bash
      run: |
        npm ci
        npm run build:bpmnio
        npm run test:vertex-moddle
        git diff --exit-code -- wwwroot/lib
    - name: Build complete solution
      run: |
        dotnet restore VertexBPMN.sln
        dotnet build VertexBPMN.sln --configuration Release --no-restore
    - name: Run complete release qualification
      shell: bash
      run: |
        dotnet test VertexBPMN.sln --configuration Release --no-build --no-restore --filter-not-trait "Category=Phase1Acceptance" --filter-not-trait "Category=Phase3ExternalAcceptance" --max-parallel-test-modules 1
        bash scripts/verify-phase1-acceptance-baseline.sh
        bash scripts/verify-phase4-acceptance.sh
        bash scripts/verify-openapi-snapshot.sh
    - name: Prove clean source tree
      run: git diff --exit-code
    - name: Pack reproducible release artifacts
      shell: bash
      run: bash scripts/verify-reproducible-packages.sh "${GITHUB_REF_NAME#v}"
    - uses: actions/upload-artifact@v7
      with:
        name: vertexbpmn-release-nuget
        path: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/SHA256SUMS
        if-no-files-found: error
        retention-days: 30

  publish-sdk:
    name: Publish VertexBPMN.Sdk and CLI to NuGet
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: vertexbpmn-release-nuget
        path: artifacts/nuget
    - name: Verify package checksums
      working-directory: artifacts/nuget
      run: sha256sum --check SHA256SUMS
    - name: Attest package provenance
      uses: actions/attest@v4
      with:
        subject-path: artifacts/nuget/*.nupkg
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish packages to NuGet.org
      run: |
        for package in artifacts/nuget/*.nupkg; do
          dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
